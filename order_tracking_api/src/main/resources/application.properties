spring.application.name=order-tracking

# SQLite
spring.datasource.url=jdbc:sqlite:order-tracking.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
# Em produção, essa chave deve ser passada como variável de ambiente ou
# num arquivo de configuração externo, como Github Secrets, para não ficar exposta no código-fonte.
jwt.secret=jwt-secret-key
jwt.timezone=-03:00
